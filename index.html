  :root {
    --crema: #f9f2e8;
    --naranja: #fc6f47;
    --naranja-soft: #ff8e6b;
    --naranja-glow: #ffb097;
    --negro: #200901;
    --gris: #6b5b50;
    --borde-suave: #e8ddd0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--crema);
    color: var(--negro);
    min-height: 100vh;
    line-height: 1.5;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Asegurar word-spacing legible en toda la UI */
  body, h1, .subtitle, label, input, button, .preview-label, footer {
    word-spacing: 0.05em;
  }

  /* Background atmosférico que evoca el certificado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 110%, var(--naranja) 0%, transparent 50%),
      radial-gradient(ellipse 60% 40% at 50% 105%, var(--naranja-glow) 0%, transparent 60%);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 56px 32px 120px;
  }

  /* Header */
  header {
    margin-bottom: 56px;
    text-align: center;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 20px;
    border: 1.5px solid var(--negro);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .logo-mark::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--naranja);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--naranja);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  h1 {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: -0.025em;
    margin-bottom: 16px;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--naranja) 0%, var(--naranja-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--gris);
    font-size: 17px;
    max-width: 540px;
    margin: 0 auto;
  }

  /* Layout principal: form + preview */
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 420px) 1fr;
    gap: 48px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  /* Formulario */
  .form-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--borde-suave);
    border-radius: 20px;
    padding: 32px;
    position: sticky;
    top: 32px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field:last-of-type {
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--negro);
    margin-bottom: 8px;
    letter-spacing: -0.005em;
  }

  label .req {
    color: var(--naranja);
    margin-left: 2px;
  }

  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--borde-suave);
    border-radius: 10px;
    background: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 400;
    color: var(--negro);
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--naranja);
    box-shadow: 0 0 0 3px rgba(252, 111, 71, 0.12);
  }

  input::placeholder {
    color: #b8a99a;
  }

  /* Tipo: pills selector */
  .pills {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .pill {
    padding: 12px;
    border: 1.5px solid var(--borde-suave);
    border-radius: 10px;
    background: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--gris);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill:hover {
    border-color: var(--naranja-glow);
  }

  .pill.active {
    background: var(--negro);
    color: var(--crema);
    border-color: var(--negro);
  }

  /* Botón de generar */
  .btn-generate {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: var(--negro);
    color: var(--crema);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-generate:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(32, 9, 1, 0.2);
  }

  .btn-generate:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-generate:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Preview */
  .preview-wrap {
    position: relative;
  }

  .preview-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .preview-frame {
    position: relative;
    background: white;
    border: 1.5px solid var(--borde-suave);
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1920 / 1303;
  }

  #preview-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .preview-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--gris);
    font-size: 14px;
    background: linear-gradient(180deg, white 0%, var(--crema) 100%);
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .preview-empty.hidden {
    opacity: 0;
  }

  .preview-empty svg {
    opacity: 0.35;
  }

  /* Botones de descarga */
  .download-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  .btn-download {
    flex: 1;
    padding: 13px 16px;
    border: 1.5px solid var(--negro);
    border-radius: 10px;
    background: var(--crema);
    color: var(--negro);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-download:hover:not(:disabled) {
    background: var(--negro);
    color: var(--crema);
  }

  .btn-download:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--negro);
    color: var(--crema);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(32, 9, 1, 0.3);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.error {
    background: #c4341e;
  }

  /* Footer sutil */
  footer {
    margin-top: 80px;
    text-align: center;
    color: var(--gris);
    font-size: 13px;
  }

  /* Loading state */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(249, 242, 232, 0.3);
    border-top-color: var(--crema);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

  // ─── Wrapping balanceado (mismo algoritmo que Python) ───────────────────
  function measureText(ctx, text, fontSize, weight) {
    ctx.font = `${weight} ${fontSize}px 'Plus Jakarta Sans'`;
    return ctx.measureText(text).width;
  }

  function combinations(n, k) {
    // Genera todas las combinaciones de k elementos de [0..n-1]
    const result = [];
    function recurse(start, combo) {
      if (combo.length === k) {
        result.push([...combo]);
        return;
      }
      for (let i = start; i < n; i++) {
        combo.push(i);
        recurse(i + 1, combo);
        combo.pop();
      }
    }
    recurse(0, []);
    return result;
  }

  function wrapBalanced(text, ctx, fontSize, weight, maxWidth, maxLines = 4) {
    const palabras = text.split(/\s+/);
    if (palabras.length <= 1) return [text];

    for (let nLineas = 1; nLineas <= maxLines; nLineas++) {
      if (nLineas === 1) {
        if (measureText(ctx, text, fontSize, weight) <= maxWidth) {
          return [text];
        }
        continue;
      }

      const nPalabras = palabras.length;
      if (nLineas > nPalabras) continue;

      // Generar todos los splits posibles: nLineas-1 puntos de corte entre 1..nPalabras-1
      const breakCombos = combinations(nPalabras - 1, nLineas - 1);

      let bestSplit = null;
      let bestScore = Infinity;

      for (const combo of breakCombos) {
        const breaks = [0, ...combo.map(i => i + 1), nPalabras];
        const lineas = [];
        const anchos = [];
        let fits = true;

        for (let i = 0; i < breaks.length - 1; i++) {
          const linea = palabras.slice(breaks[i], breaks[i + 1]).join(' ');
          const ancho = measureText(ctx, linea, fontSize, weight);
          if (ancho > maxWidth) {
            fits = false;
            break;
          }
          lineas.push(linea);
          anchos.push(ancho);
        }

        if (fits) {
          const score = Math.max(...anchos) - Math.min(...anchos);
          if (score < bestScore) {
            bestScore = score;
            bestSplit = lineas;
          }
        }
      }

      if (bestSplit) return bestSplit;
    }
    return [text];
  }

  function fitTitulo(texto, ctx, maxWidth) {
    const SIZE_THRESHOLD_1L = TITULO_SIZE_MAX - 35;

    // 1 línea, reducir tamaño desde max hasta threshold
    for (let s = TITULO_SIZE_MAX; s >= SIZE_THRESHOLD_1L; s -= 3) {
      if (measureText(ctx, texto, s, 600) <= maxWidth) {
        return { lineas: [texto], size: s };
      }
    }

    // 2 líneas
    for (let s = TITULO_SIZE_MAX; s >= TITULO_SIZE_MIN; s -= 3) {
      const lineas = wrapBalanced(texto, ctx, s, 600, maxWidth, 2);
      if (lineas && lineas.length <= 2) {
        const todasCaben = lineas.every(l => measureText(ctx, l, s, 600) <= maxWidth);
        if (todasCaben) return { lineas, size: s };
      }
    }

    // 3 líneas
    for (let s = TITULO_SIZE_MAX; s >= TITULO_SIZE_MIN; s -= 5) {
      const lineas = wrapBalanced(texto, ctx, s, 600, maxWidth, 3);
      if (lineas) {
        const todasCaben = lineas.every(l => measureText(ctx, l, s, 600) <= maxWidth);
        if (todasCaben) return { lineas, size: s };
      }
    }

    // Fallback
    const lineas = wrapBalanced(texto, ctx, TITULO_SIZE_MIN, 600, maxWidth, 4);
    return { lineas, size: TITULO_SIZE_MIN };
  }

  // ─── Renderizar certificado ─────────────────────────────────────────────
  function render() {
    if (!state.templateLoaded || !state.fontLoaded) return;

    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');

    // Limpiar y dibujar template
    ctx.clearRect(0, 0, CERT_W, CERT_H);
    ctx.drawImage(templateImg, 0, 0, CERT_W, CERT_H);

    ctx.fillStyle = NEGRO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    // === TÍTULO ===
    const curso = (state.curso || '').trim();
    if (curso) {
      const { lineas, size } = fitTitulo(curso, ctx, ANCHO_TITULO_MAX);
      ctx.font = `600 ${size}px 'Plus Jakarta Sans'`;
      const lineHeight = Math.round(size * 0.963);
      const yInicio = Y_TITULO - (lineas.length * lineHeight) / 2;
      lineas.forEach((linea, i) => {
        ctx.fillText(linea, X_CENTRO, yInicio + i * lineHeight);
      });
    }

    // === NOMBRE ===
    const estudiante = (state.estudiante || '').trim();
    if (estudiante) {
      ctx.font = `600 ${NOMBRE_SIZE}px 'Plus Jakarta Sans'`;
      ctx.fillText(estudiante, X_CENTRO, Y_NOMBRE - NOMBRE_SIZE / 2);
    }

    // === PÁRRAFO ===
    const horas = (state.horas || '').toString().trim();
    if (estudiante && curso && horas) {
      const tipo = state.tipo;
      const parrafoTexto = `Ha realizado y completado con éxito su ${tipo} en Coderhouse, con ${horas} horas de duración, cumpliendo todos los requisitos académicos exigidos.`;
      const lineas = wrapBalanced(parrafoTexto, ctx, PARRAFO_SIZE, 400, ANCHO_PARRAFO_MAX, 4);
      ctx.font = `400 ${PARRAFO_SIZE}px 'Plus Jakarta Sans'`;
      const lineHeight = 42;
      const yInicio = Y_PARRAFO - (lineas.length * lineHeight) / 2;
      lineas.forEach((linea, i) => {
        ctx.fillText(linea, X_CENTRO, yInicio + i * lineHeight);
      });
    }

    // === FECHA ===
    const fecha = (state.fecha || '').trim();
    if (fecha) {
      ctx.font = `400 ${FECHA_SIZE}px 'Plus Jakarta Sans'`;
      ctx.fillText(fecha, X_CENTRO, Y_FECHA - FECHA_SIZE / 2);
    }

    // Mostrar/ocultar el placeholder
    const empty = document.getElementById('preview-empty');
    const hasContent = curso || estudiante || horas || fecha;
    if (hasContent) {
      empty.classList.add('hidden');
    } else {
      empty.classList.remove('hidden');
    }
  }

  function tryAutoRender() {
    if (state.templateLoaded && state.fontLoaded) {
      render();
    }
  }

  // ─── Validación ─────────────────────────────────────────────────────────
  function isComplete() {
    return state.curso.trim() &&
           state.estudiante.trim() &&
           state.tipo &&
           state.horas && Number(state.horas) > 0 &&
           state.fecha.trim();
  }

  function updateButtonState() {
    const complete = isComplete();
    document.getElementById('btn-generate').disabled = !complete;
    document.getElementById('btn-png').disabled = !state.lastGenerated;
    document.getElementById('btn-pdf').disabled = !state.lastGenerated;
  }

  // ─── Slugify para nombres de archivo ────────────────────────────────────
  function slugify(text) {
    return text
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Za-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
  }

  // ─── Descargas ──────────────────────────────────────────────────────────
  function downloadPNG() {
    const canvas = document.getElementById('preview-canvas');
    const slug = slugify(state.estudiante || 'estudiante');
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Certificado_${slug}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`PNG descargado`);
    }, 'image/png');
  }

  function downloadPDF() {
    if (typeof window.jspdf === 'undefined') {
      showToast('jsPDF no se cargó. Verificá tu conexión.', true);
      return;
    }
    const { jsPDF } = window.jspdf;
    const canvas = document.getElementById('preview-canvas');
    const imgData = canvas.toDataURL('image/png');

    // Tamaño A4 landscape (297 × 210 mm) — el ratio del cert es ≈ 1.474, A4 landscape es 1.414
    // Mejor: usar el ratio exacto del certificado (1920/1303 ≈ 1.474)
    // PDF en mm: ancho 297, alto = 297 / (1920/1303) ≈ 201.6
    const pdfWidth = 297;
    const pdfHeight = pdfWidth * (CERT_H / CERT_W);

    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'mm',
      format: [pdfWidth, pdfHeight],
      compress: true
    });
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');

    const slug = slugify(state.estudiante || 'estudiante');
    pdf.save(`Certificado_${slug}.pdf`);
    showToast('PDF descargado');
  }

  // ─── Toast ──────────────────────────────────────────────────────────────
  let toastTimeout;
  function showToast(text, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  // ─── Event listeners ────────────────────────────────────────────────────
  document.getElementById('curso').addEventListener('input', e => {
    state.curso = e.target.value;
    state.lastGenerated = false;
    render();
    updateButtonState();
  });

  document.getElementById('estudiante').addEventListener('input', e => {
    state.estudiante = e.target.value;
    state.lastGenerated = false;
    render();
    updateButtonState();
  });

  document.getElementById('horas').addEventListener('input', e => {
    state.horas = e.target.value;
    state.lastGenerated = false;
    render();
    updateButtonState();
  });

  document.getElementById('fecha').addEventListener('input', e => {
    state.fecha = e.target.value;
    state.lastGenerated = false;
    render();
    updateButtonState();
  });

  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      state.tipo = pill.dataset.tipo;
      state.lastGenerated = false;
      render();
      updateButtonState();
    });
  });

  document.getElementById('btn-generate').addEventListener('click', () => {
    if (!isComplete()) {
      showToast('Completá todos los campos primero', true);
      return;
    }
    const btn = document.getElementById('btn-generate');
    const txt = document.getElementById('btn-text');
    btn.disabled = true;
    txt.innerHTML = '<span class="spinner"></span> Generando...';
    setTimeout(() => {
      render();
      state.lastGenerated = true;
      txt.textContent = 'Regenerar certificado';
      btn.disabled = false;
      updateButtonState();
      showToast('Listo, ya podés descargarlo');
    }, 350);
  });

  document.getElementById('btn-png').addEventListener('click', downloadPNG);
  document.getElementById('btn-pdf').addEventListener('click', downloadPDF);

  // Estado inicial
  updateButtonState();
</script>

</body>
</html>
